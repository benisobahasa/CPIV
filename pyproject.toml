[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpiv"
version = "0.2.2"
description = "CPIV: Causal Perturbation & Intervention for Voice. Explainable attribution of the causes behind voice changes, plus a robustness benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "benisobahasa" }]
keywords = ["speech", "forensic phonetics", "spoofing", "attribution", "explainable AI", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "librosa>=0.10",
  "soundfile>=0.12",
  "praat-parselmouth>=0.4.3",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
cpiv = "cpiv.cli:main"

[project.urls]
Homepage = "https://github.com/benisobahasa/CPIV"
Issues = "https://github.com/benisobahasa/CPIV/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpiv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
